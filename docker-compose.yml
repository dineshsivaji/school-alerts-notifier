version: '3.8'

services:
  # Service A: The persistent Node.js WhatsApp daemon
  whatsapp-bridge:
    build: ./whatsapp-bridge
    container_name: whatsapp-bridge
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    volumes:
      # Maps your existing local auth folder into the container
      - ./auth:/app/auth_info_baileys

  # Service B: The scheduled Python extraction client
  python-scraper:
    build: ./python-scraper
    container_name: python-scraper
    restart: unless-stopped
    env_file: .env
    depends_on:
      - whatsapp-bridge
    environment:
      - TZ=Asia/Kolkata
    volumes:
      # Maps a local folder to keep 'last_processed_msg.json' persistent
      # Left: Local host folder | Right: Scraper work directory inside container
      - ./scraper-data:/app/data

# We removed the global named volumes block entirely since we are using local bind mounts!