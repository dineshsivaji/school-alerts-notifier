
services:
  python-scraper:
    build: .
    container_name: python-scraper
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
      - NATS_URL=nats://nats:4222   # reached by name on the shared mini-net
    volumes:
      # Maps a local folder to keep 'last_processed_msg.json' persistent
      # Left: Local host folder | Right: Scraper work directory inside container
      - ./scraper-data:/app/data
    networks:
      - mini-net

networks:
  mini-net:
    external: true
